name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }}/${{ matrix.arch }}, Zig ${{ matrix.zig_version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
            zig_version: "0.16.0"
          - os: ubuntu-24.04-arm
            arch: aarch64
            zig_version: "0.16.0"
          - os: macos-latest
            arch: aarch64
            zig_version: "0.16.0"
          - os: macos-13
            arch: x86_64
            zig_version: "0.16.0"
          - os: windows-latest
            arch: x86_64
            zig_version: "0.16.0"
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v1
        with:
          version: ${{ matrix.zig_version }}

      - name: Verify Zig version
        run: zig version

      - name: Build library
        run: zig build

      - name: Run all test suites
        run: zig build test

  lint:
    name: zlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install zlint
        run: |
          curl -sSfL https://github.com/DonIsaac/zlint/releases/download/v0.9.1/zlint-linux-x86_64 -o /usr/local/bin/zlint
          chmod +x /usr/local/bin/zlint
          zlint --version

      - name: Run zlint
        run: zlint src/*.zig
